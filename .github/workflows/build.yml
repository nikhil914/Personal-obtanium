name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Set up signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Releases need the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets so every release is signed with the same key."
              exit 1
            fi
            echo "::warning::No signing secrets set. This build uses a throwaway key, so a later build cannot update over it."
            KEYSTORE_PASSWORD=throwaway
            KEY_ALIAS=throwaway
            KEY_PASSWORD=throwaway
            keytool -genkeypair -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Personal Obtainium test build"
            echo "kind=throwaway-key" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Build APKs
        env:
          SERVER_SYNC_URL: ${{ vars.SERVER_SYNC_URL }}
        run: |
          VERSION=$(grep -oP "^version: [^\+]+" pubspec.yaml | tail -c +10)
          flutter build apk --release --flavor normal --dart-define=SERVER_SYNC_URL="$SERVER_SYNC_URL"
          flutter build apk --release --flavor normal --split-per-abi --dart-define=SERVER_SYNC_URL="$SERVER_SYNC_URL"
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-normal-release.apk build/app/outputs/flutter-apk/app-normal-release.apk; do
            [ -f "$f" ] || continue
            abi=$(basename "$f" | sed -E 's/^app-(.*)-?normal-release\.apk$/\1/; s/-$//')
            cp "$f" "dist/personal-obtainium-${VERSION}${abi:+-$abi}.apk"
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: personal-obtainium-${{ steps.signing.outputs.kind }}
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
