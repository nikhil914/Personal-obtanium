<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App list</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5f6b7a; --line: #e2e6eb;
    --accent: #2563eb; --danger: #c62828; --ok: #1b7f3b; --warn: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --text: #e6e9ed; --muted: #95a1af; --line: #2b323a;
      --accent: #6b9bff; --danger: #ff6b6b; --ok: #4cc27a; --warn: #f0a640;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .sub code { background: var(--card); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  input { flex: 1 1 220px; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); font: inherit; }
  input.note { flex: 0 1 160px; }
  button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .4; cursor: default; }
  #msg { min-height: 22px; margin: 10px 2px; color: var(--muted); }
  #msg.err { color: var(--danger); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
  .num { color: var(--muted); width: 22px; text-align: right; flex: none; }
  .info { flex: 1; min-width: 0; }
  .info a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta .ok { color: var(--ok); } .meta .warn { color: var(--warn); }
  .actions { display: flex; gap: 4px; flex: none; }
  .actions button { padding: 6px 9px; }
  .empty { color: var(--muted); text-align: center; padding: 24px; }
  @media (max-width: 520px) { li { flex-wrap: wrap; } .actions { width: 100%; justify-content: flex-end; } }
</style>
</head>
<body>
<main>
  <h1>App list</h1>
  <p class="sub">The app reads this list from <code id="feed">/apps.json</code> each time it opens. Changes save right away.</p>

  <form id="add">
    <input id="url" placeholder="https://github.com/owner/repo" autocomplete="off" required>
    <input id="note" class="note" placeholder="Name (optional)" autocomplete="off">
    <button class="primary" type="submit">Add</button>
  </form>
  <div id="msg"></div>
  <ul id="list"></ul>
</main>
<script>
const $ = (id) => document.getElementById(id);
let apps = [];
const releaseCache = {};

$('feed').textContent = location.origin + '/apps.json';

function say(text, isErr) { $('msg').textContent = text || ''; $('msg').className = isErr ? 'err' : ''; }

async function api(method, body) {
  const res = await fetch('/api/apps', {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  apps = data.apps;
  render();
  return data;
}

function ghRepo(url) {
  const m = url.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)$/i);
  return m ? m[1] + '/' + m[2] : null;
}

async function releaseInfo(repo, el) {
  if (!releaseCache[repo]) {
    releaseCache[repo] = fetch('https://api.github.com/repos/' + repo + '/releases/latest')
      .then(async (r) => {
        if (r.status === 404) return { text: 'No release yet', cls: 'warn' };
        if (!r.ok) return { text: 'Release check unavailable (' + r.status + ')', cls: '' };
        const d = await r.json();
        const apks = (d.assets || []).filter((a) => /\.apk$/i.test(a.name));
        const when = d.published_at ? new Date(d.published_at).toLocaleDateString() : '';
        return apks.length
          ? { text: 'Latest ' + d.tag_name + ' · ' + apks.length + ' APK' + (apks.length > 1 ? 's' : '') + (when ? ' · ' + when : ''), cls: 'ok' }
          : { text: 'Latest ' + d.tag_name + ' has no APK attached', cls: 'warn' };
      })
      .catch(() => ({ text: 'Release check unavailable', cls: '' }));
  }
  const info = await releaseCache[repo];
  el.textContent = info.text;
  el.className = info.cls;
}

function render() {
  const list = $('list');
  list.textContent = '';
  if (!apps.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'No apps yet. Add a GitHub link above.';
    list.appendChild(li);
    return;
  }
  apps.forEach((app, i) => {
    const li = document.createElement('li');

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = i + 1;

    const info = document.createElement('div');
    info.className = 'info';
    if (app.note) {
      const name = document.createElement('div');
      name.textContent = app.note;
      name.style.fontWeight = '600';
      info.appendChild(name);
    }
    const a = document.createElement('a');
    a.href = app.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = app.url;
    info.appendChild(a);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const status = document.createElement('span');
    meta.appendChild(status);
    if (app.settings) {
      const s = document.createElement('span');
      s.textContent = ' · custom settings';
      meta.appendChild(s);
    }
    info.appendChild(meta);
    const repo = ghRepo(app.url);
    if (repo) { status.textContent = 'Checking releases…'; releaseInfo(repo, status); }

    const actions = document.createElement('div');
    actions.className = 'actions';
    const up = button('↑', 'Move up', i === 0, () => move(i, -1));
    const down = button('↓', 'Move down', i === apps.length - 1, () => move(i, 1));
    const del = button('Remove', 'Remove from list', false, () => remove(app));
    del.classList.add('danger');
    actions.append(up, down, del);

    li.append(num, info, actions);
    list.appendChild(li);
  });
}

function button(label, title, disabled, onClick) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; b.title = title; b.disabled = disabled;
  b.addEventListener('click', onClick);
  return b;
}

async function move(i, delta) {
  const next = apps.slice();
  const [item] = next.splice(i, 1);
  next.splice(i + delta, 0, item);
  try { await api('PUT', { apps: next }); say('Order saved.'); } catch (e) { say(e.message, true); }
}

async function remove(app) {
  if (!confirm('Remove ' + app.url + ' from the list?\n\nThe app stops tracking it on its next sync.')) return;
  try { await api('DELETE', { url: app.url }); say('Removed.'); } catch (e) { say(e.message, true); }
}

$('add').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const url = $('url').value.trim();
  const note = $('note').value.trim();
  try {
    await api('POST', note ? { url, note } : { url });
    $('url').value = ''; $('note').value = '';
    say('Added. Phones and car units pick it up the next time the app opens.');
  } catch (e) { say(e.message, true); }
});

api('GET').catch((e) => say(e.message, true));
</script>
</body>
</html>
